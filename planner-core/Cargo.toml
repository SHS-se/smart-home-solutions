[workspace]
members = ["models", "solver"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Rust symbol names can differ by build host; release Wasm contains only
# executable sections and reproducible toolchain metadata.
strip = "symbols"
