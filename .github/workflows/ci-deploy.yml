name: CI & Deploy

# Runs lint + unit tests + build on every push/PR.
# After the gate passes, on push to main/dev it (1) applies Supabase migrations to the matching
# project, then (2) deploys the frontend to Cloudflare Pages:
#   main -> production  (prod Supabase oosxndduqzhvrorgogaw)  https://shs-smart-home-solutions.pages.dev
#   dev  -> preview     (test Supabase vxqpgbzseckgceopitpm)  https://dev.shs-smart-home-solutions.pages.dev
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN       - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID      - your Cloudflare account ID
#   SUPABASE_ACCESS_TOKEN      - account access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD_PROD  - database password for the prod project (oosxndduqzhvrorgogaw)
#   SUPABASE_DB_PASSWORD_TEST  - database password for the test project (vxqpgbzseckgceopitpm)
# VITE_SUPABASE_* anon keys are baked in at build time (public), so no anon secrets here.
# NOTE: edge functions are NOT deployed here yet — still deployed manually via scripts/dev.sh.

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests
        run: deno task test

      - name: Build
        # dev branch builds against the TEST Supabase (mode=test); all others use prod (.env).
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npm run build:test
          else
            npm run build
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  migrate:
    name: Apply Supabase migrations
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Attaching an environment lets you require manual approval before prod migrations run:
    # add "Required reviewers" to the `production` environment in repo settings.
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # main -> prod project, dev -> test project (refs are not secret; they're in .env / .env.test).
      SUPABASE_PROJECT_REF: ${{ github.ref_name == 'main' && 'oosxndduqzhvrorgogaw' || 'vxqpgbzseckgceopitpm' }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_TEST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        # Applies only pending migrations from supabase/migrations (forward-only, no auto-rollback).
        # When prod is already up to date this is a no-op.
        run: supabase db push

  deploy:
    name: Deploy to Cloudflare Pages
    needs: migrate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4.x requires Node >= 22

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler does not auto-create a Pages project in CI, so create it on first run.
          npx -y wrangler@4.103.0 pages project list | grep -q shs-smart-home-solutions \
            || npx -y wrangler@4.103.0 pages project create shs-smart-home-solutions --production-branch=main
          # Output directory comes from wrangler.toml (pages_build_output_dir = "dist").
          # main -> production deployment; dev -> preview deployment (dev.<project>.pages.dev).
          npx -y wrangler@4.103.0 pages deploy --branch=${{ github.ref_name }}
