name: CI & Deploy

# Runs lint, four unit-test shards and frontend validation in parallel on push/PR.
# After the gate passes, on push to main/dev it (1) applies Supabase migrations to the matching
# project, then (2) deploys the Supabase edge functions to that project, then (3) deploys the
# frontend to a per-environment Cloudflare Pages project and (4) prunes that project's old
# deployments, retaining a short manual rollback window:
#   main -> prod-smart-home-solutions  (prod Supabase oosxndduqzhvrorgogaw)  https://prod-smart-home-solutions.pages.dev
#   dev  -> test-smart-home-solutions  (test Supabase vxqpgbzseckgceopitpm)  https://test-smart-home-solutions.pages.dev
# Each project's production branch is the deploying branch, so the canonical <project>.pages.dev
# URL always points at that environment's latest build (no hash, no per-deploy URL to hunt for).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN       - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID      - your Cloudflare account ID
#   SUPABASE_ACCESS_TOKEN      - account access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD_PROD  - database password for the prod project (oosxndduqzhvrorgogaw)
#   SUPABASE_DB_PASSWORD_TEST  - database password for the test project (vxqpgbzseckgceopitpm)
# VITE_SUPABASE_* anon keys are baked in at build time (public), so no anon secrets here.
# Edge functions are deployed by the `functions` job below (Supabase Management API via
# SUPABASE_ACCESS_TOKEN — no DB password or Docker needed).
#
# Each job runs only for what changed since the last successful deploy of the branch
# (scripts/ci-changes.ts follows local imports, so a planner change still redeploys the
# portal, which runs the planner in the browser). Run the workflow manually to deploy
# everything.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the last successful run
    outputs:
      deploy: ${{ steps.base.outputs.deploy }}
      code: ${{ steps.detect.outputs.code }}
      frontend: ${{ steps.detect.outputs.frontend }}
      migrations: ${{ steps.detect.outputs.migrations }}
      functions: ${{ steps.detect.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Find the last deployed commit
        # Diff against the last successful run, not the previous push: a cancelled or failed
        # run deployed nothing, so its changes must ride along with the next one.
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          deploy=false
          if [ "$EVENT" != pull_request ] && { [ "$BRANCH" = main ] || [ "$BRANCH" = dev ]; }; then deploy=true; fi
          case "$EVENT" in
            pull_request) sha="$PR_BASE" ;;
            workflow_dispatch) sha="" ;; # deploy everything
            *) sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-deploy.yml/runs?branch=$BRANCH&status=success&per_page=30" \
                 --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // ""') ;;
          esac
          echo "Base: ${sha:-none (everything)}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Classify changed files
        id: detect
        run: deno run -A --no-check scripts/ci-changes.ts --base "${{ steps.base.outputs.sha }}" --workflow ci-deploy.yml

  quality:
    name: Lint & typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # vite build uses SWC and never runs tsc, so without this step type errors
        # would ship silently.
        run: npm run typecheck

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check isolated edge-function dependencies
        run: deno run --allow-read --allow-write --allow-run scripts/check-edge-function-dependencies.ts

  unit:
    name: Unit tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests
        run: deno task test --shard ${{ matrix.shard }}/4

  frontend:
    name: Build & browser tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # dev branch builds against the TEST Supabase (mode=test); all others use prod (.env).
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npm run build:test
          else
            npm run build
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (mocked backend)
        # Same command locally and in CI; Playwright owns the preview server.
        run: npm run test:e2e:local

  ci:
    name: Lint, test & build
    needs: [changes, quality, unit, frontend]
    # Run the gate even after a failed dependency, so its required status fails
    # explicitly. Frontend validation may skip only when no frontend changed.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          if [ "$FRONTEND_CHANGED" = true ]; then
            test "$FRONTEND_RESULT" = success
          else
            test "$FRONTEND_RESULT" = skipped
          fi

  migrate:
    name: Apply Supabase migrations
    needs: [changes, ci]
    # !failure() lets a skipped job pass through while still stopping on a failed one.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.deploy == 'true' && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Attaching an environment lets you require manual approval before prod migrations run:
    # add "Required reviewers" to the `production` environment in repo settings.
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # main -> prod project, dev -> test project (refs are not secret; they're in .env / .env.test).
      SUPABASE_PROJECT_REF: ${{ github.ref_name == 'main' && 'oosxndduqzhvrorgogaw' || 'vxqpgbzseckgceopitpm' }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_TEST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        # Applies only pending migrations from supabase/migrations (forward-only, no auto-rollback).
        # When prod is already up to date this is a no-op.
        #
        # --include-all: also apply pending migrations whose timestamps sort BEFORE the
        # remote's last applied migration. This happens when a migration is committed with
        # a backdated filename after a later-stamped migration already reached the target
        # (e.g. 20260627*_stripe_* were committed on July 3). Without the flag the CLI
        # refuses and the deploy fails. Safe here because migrations in this repo are
        # written idempotently (IF NOT EXISTS / guarded DO blocks) — keep doing that.
        run: supabase db push --include-all

      - name: Configure shared weather cron endpoint
        # The same migration runs in test and production. Store the current
        # project's function URL in the private cron credential row so each
        # database invokes its own sync-weather-history deployment.
        run: |
          supabase db query --linked \
            "UPDATE private.energy_weather_sync_credentials
             SET function_url = 'https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/sync-weather-history'
             WHERE singleton"

  functions:
    name: Deploy edge functions
    needs: [changes, migrate]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.deploy == 'true' && needs.changes.outputs.functions != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same gated environment as migrate, so prod function deploys can require approval too.
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # main -> prod project, dev -> test project (refs are not secret).
      SUPABASE_PROJECT_REF: ${{ github.ref_name == 'main' && 'oosxndduqzhvrorgogaw' || 'vxqpgbzseckgceopitpm' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        # Deploys the functions whose code changed (per-function settings come from config.toml,
        # and changing it deploys them all). --use-api bundles without Docker; auth is the access
        # token above, so no DB password is needed. Runs after migrate so functions can rely on the
        # latest schema/RPCs. The plan step goes first: the ingest functions call it.
        env:
          FUNCTIONS: ${{ needs.changes.outputs.functions }}
        run: |
          set -euo pipefail
          rest=()
          for name in $FUNCTIONS; do
            if [ "$name" = energy-optimisation-plan-step ]; then
              bash scripts/deploy-energy-planning.sh "$SUPABASE_PROJECT_REF"
            else
              rest+=("$name")
            fi
          done
          if [ ${#rest[@]} -gt 0 ]; then
            supabase functions deploy "${rest[@]}" --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [changes, functions]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.deploy == 'true' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4.x requires Node >= 22

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          WRANGLER="npx -y wrangler@4.103.0"
          # main -> prod project, dev -> test project. Each project's production branch is the
          # deploying branch, so deploying that branch is a PRODUCTION deploy served at the clean
          # <project>.pages.dev URL (no hash).
          if [ "$BRANCH" = "main" ]; then PROJECT=prod-smart-home-solutions; else PROJECT=test-smart-home-solutions; fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          # wrangler does not auto-create a Pages project in CI, so create it on first run.
          $WRANGLER pages project list | grep -q "$PROJECT" \
            || $WRANGLER pages project create "$PROJECT" --production-branch="$BRANCH"
          # Output directory comes from wrangler.toml (pages_build_output_dir = "dist").
          $WRANGLER pages deploy --project-name="$PROJECT" --branch="$BRANCH"

      - name: Verify deployed static assets
        env:
          DEPLOY_ORIGIN: ${{ github.ref_name == 'main' && 'https://smarthomesolutions.se' || 'https://test.smarthomesolutions.se' }}
        run: node scripts/verify-pages-deployment.mjs dist "$DEPLOY_ORIGIN"

      - name: Prune old Cloudflare deployments
        # Keep a small rollback window instead of deleting every previous deployment.
        # Best-effort: a prune hiccup must never fail an already-successful deploy, so every call is
        # guarded (the step runs under `bash -e`). The newest KEEP are never deleted, and the API
        # refuses to delete the live production deployment anyway, so the current build is safe.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KEEP=5   # current deployment plus four recent manual rollback versions
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          # Default page size is plenty: each run prunes back down to KEEP, so the list stays short.
          # (Passing per_page=100 here returns HTTP 400 from this endpoint.)
          resp=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" || true)
          keep_ids=$(printf '%s' "$resp" | jq -r --argjson keep "$KEEP" \
            '(.result // []) | sort_by(.created_on) | reverse | .[:$keep] | .[].id' 2>/dev/null || true)
          del_ids=$(printf '%s' "$resp" | jq -r --argjson keep "$KEEP" \
            '(.result // []) | sort_by(.created_on) | reverse | .[$keep:] | .[].id' 2>/dev/null || true)
          if [ -z "$keep_ids$del_ids" ]; then
            echo "Could not list deployments for $PROJECT; skipping prune. Response (first 800 chars):"
            echo "${resp:0:800}"
            exit 0
          fi
          echo "Keeping newest $KEEP deployment(s) for $PROJECT: $keep_ids"
          for id in $del_ids; do
            echo "Deleting old deployment: $id"
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$id" >/dev/null \
              || echo "  (skipped: $id is protected or already gone)"
          done
