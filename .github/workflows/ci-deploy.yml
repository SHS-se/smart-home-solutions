name: CI & Deploy

# Runs lint + unit tests + build on every push/PR.
# After the gate passes, deploys to Cloudflare Pages on push to:
#   main -> production  (prod Supabase, from .env)        https://shs-smart-home-solutions.pages.dev
#   dev  -> preview     (test Supabase, from .env.test)   https://dev.shs-smart-home-solutions.pages.dev
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID
# VITE_SUPABASE_* values are baked in at build time (public anon keys), so no Supabase secrets here.

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests
        run: deno task test

      - name: Build
        # dev branch builds against the TEST Supabase (mode=test); all others use prod (.env).
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npm run build:test
          else
            npm run build
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4.x requires Node >= 22

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler does not auto-create a Pages project in CI, so create it on first run.
          npx -y wrangler@4.103.0 pages project list | grep -q shs-smart-home-solutions \
            || npx -y wrangler@4.103.0 pages project create shs-smart-home-solutions --production-branch=main
          # Output directory comes from wrangler.toml (pages_build_output_dir = "dist").
          # main -> production deployment; dev -> preview deployment (dev.<project>.pages.dev).
          npx -y wrangler@4.103.0 pages deploy --branch=${{ github.ref_name }}
