name: Planner bench

# Replays every bench test case through planner versions and stores the plans
# in the TEST Supabase project (docs/planner-bench/README.md).
#
# Successful CI deployments establish the production/main and test/dev versions.
# The bench remains in TEST and historical comparisons remain available.
# Manual dispatch runs/re-scores requested cases without changing deployment identity.

on:
  workflow_run:
    workflows: ["CI & Deploy"]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      shas:
        description: "Commits to run: comma-separated SHAs, 'all' for every commit on the bench, or 'none' to only rescore"
        required: true
        default: all
      scenario:
        description: "Only this test case id (blank = every case)"
        required: false
        default: ""
      force:
        description: "Re-run cases that already have a result"
        type: boolean
        default: false
      rerecord:
        description: "Read each case's measured load and the days before it again from the home's tables (after they were corrected)"
        type: boolean
        default: false

concurrency:
  group: planner-bench
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: Run planner bench
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
      SUPABASE_PROJECT_REF: vxqpgbzseckgceopitpm
      BENCH_SUPABASE_URL: https://vxqpgbzseckgceopitpm.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          # Run the current dev harness; planner versions use historical worktrees.
          ref: dev
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply bench schema to the test project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db query --linked --file bench/schema.sql

      - name: Fetch the service-role key
        run: |
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$key"
          echo "BENCH_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Resolve successfully deployed planner commits
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in main dev; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-deploy.yml/runs?branch=$branch&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
            [ -n "$sha" ] || { echo "No successful deployment for $branch" >&2; exit 1; }
            echo "DEPLOYED_$branch=$sha" >> "$GITHUB_ENV"
          done

      - name: Run the bench
        env:
          INPUT_SHAS: ${{ inputs.shas }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RERECORD: ${{ inputs.rerecord }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            deno run -A --no-check --sloppy-imports --config deno.json bench/run.ts \
              --shas "$DEPLOYED_main,$DEPLOYED_dev,all" --current "$DEPLOYED_main" --test "$DEPLOYED_dev"
          else
            extra=()
            [ -n "$INPUT_SCENARIO" ] && extra+=(--scenario "$INPUT_SCENARIO")
            [ "$INPUT_FORCE" = "true" ] && extra+=(--force)
            [ "$INPUT_RERECORD" = "true" ] && extra+=(--rerecord)
            deno run -A --no-check --sloppy-imports --config deno.json bench/run.ts \
              --shas "$INPUT_SHAS" "${extra[@]}"
          fi
