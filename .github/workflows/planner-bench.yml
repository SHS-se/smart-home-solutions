name: Planner bench

# Replays every bench test case through planner versions and stores the plans
# in the TEST Supabase project (docs/planner-bench/README.md).
#
# - Push to dev: benchmarks the pushed commit and marks it as the current
#   planner, because dev is what the test environment runs.
# - Manual / from the bench page: runs any commits, typically `all` after a
#   new test case is added. Existing results are kept unless `force` is set.
#
# Uses the existing SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD_TEST secrets.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      shas:
        description: "Commits to run: comma-separated SHAs, or 'all' for every commit already on the bench"
        required: true
        default: all
      scenario:
        description: "Only this test case id (blank = every case)"
        required: false
        default: ""
      force:
        description: "Re-run cases that already have a result"
        type: boolean
        default: false

concurrency:
  group: planner-bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    name: Run planner bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
      SUPABASE_PROJECT_REF: vxqpgbzseckgceopitpm
      BENCH_SUPABASE_URL: https://vxqpgbzseckgceopitpm.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          # Planner versions are checked out as worktrees of arbitrary commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply bench schema to the test project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db query --linked --file bench/schema.sql

      - name: Fetch the service-role key
        run: |
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$key"
          echo "BENCH_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Run the bench
        env:
          INPUT_SHAS: ${{ inputs.shas }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            deno run -A --no-check --sloppy-imports --config deno.json bench/run.ts \
              --shas "$GITHUB_SHA" --branch dev --current "$GITHUB_SHA"
          else
            extra=()
            [ -n "$INPUT_SCENARIO" ] && extra+=(--scenario "$INPUT_SCENARIO")
            [ "$INPUT_FORCE" = "true" ] && extra+=(--force)
            deno run -A --no-check --sloppy-imports --config deno.json bench/run.ts \
              --shas "$INPUT_SHAS" "${extra[@]}"
          fi
