name: Planner bench

# Replays every bench test case through planner versions and stores the plans
# in the TEST Supabase project (docs/planner-bench/README.md).
#
# - Push to dev: benchmarks the pushed commit and marks it as the current
#   planner, because dev is what the test environment runs.
# - Manual / from the bench page: runs any commits, typically `all` after a
#   new test case is added. Existing results are kept unless `force` is set.
#   `none` runs no planners and only recomputes stale scores (after a case's
#   criteria change). Every run ends by rescoring whatever is stale.
#
# A push runs the bench only when it changed the planner or the bench itself
# (scripts/ci-changes.ts) since the last successful bench push; otherwise the
# result would repeat the current planner's. It runs the pushed commit and
# `all`, which re-runs only results planned for an older bench household.
#
# Uses the existing SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD_TEST secrets.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      shas:
        description: "Commits to run: comma-separated SHAs, 'all' for every commit on the bench, or 'none' to only rescore"
        required: true
        default: all
      scenario:
        description: "Only this test case id (blank = every case)"
        required: false
        default: ""
      force:
        description: "Re-run cases that already have a result"
        type: boolean
        default: false

concurrency:
  group: planner-bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect planner changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the last successful run
    outputs:
      planner: ${{ steps.detect.outputs.planner }}
      bench: ${{ steps.detect.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/planner-bench.yml/runs?branch=dev&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          deno run -A --no-check scripts/ci-changes.ts --base "$base" --workflow planner-bench.yml

  bench:
    name: Run planner bench
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'push' || needs.changes.outputs.planner == 'true' || needs.changes.outputs.bench == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
      SUPABASE_PROJECT_REF: vxqpgbzseckgceopitpm
      BENCH_SUPABASE_URL: https://vxqpgbzseckgceopitpm.supabase.co
      # Optional: Open-Meteo's commercial API for archived weather (bench/weather.ts).
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Planner versions are checked out as worktrees of arbitrary commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply bench schema to the test project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db query --linked --file bench/schema.sql

      - name: Fetch the service-role key
        run: |
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$key"
          echo "BENCH_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Run the bench
        env:
          INPUT_SHAS: ${{ inputs.shas }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            deno run -A --no-check --sloppy-imports --config deno.json bench/run.ts \
              --shas "$GITHUB_SHA,all" --branch dev --current "$GITHUB_SHA"
          else
            extra=()
            [ -n "$INPUT_SCENARIO" ] && extra+=(--scenario "$INPUT_SCENARIO")
            [ "$INPUT_FORCE" = "true" ] && extra+=(--force)
            deno run -A --no-check --sloppy-imports --config deno.json bench/run.ts \
              --shas "$INPUT_SHAS" "${extra[@]}"
          fi
