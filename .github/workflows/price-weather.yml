name: Refresh regional price weather

on:
  schedule:
    # After the four ECMWF open-data releases, with another attempt if a release is late.
    - cron: '43 1,2,7,8,13,14,19,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: github.ref_name == 'main'
    name: Collect ${{ matrix.source }} in ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        source: [ecmwf, gfs]
        environment: [preview, production]
        include:
          - environment: preview
            project: vxqpgbzseckgceopitpm
            branch: dev
          - environment: production
            project: oosxndduqzhvrorgogaw
            branch: main
    concurrency:
      group: price-weather-${{ matrix.environment }}-${{ matrix.source }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install weather decoding dependencies
        run: python -m pip install 'requests==2.34.2' 'eccodes==2.50.0'
      - name: Refresh only this source
        run: python scripts/refresh-price-weather.py --project "${{ matrix.project }}" --source "${{ matrix.source }}"
